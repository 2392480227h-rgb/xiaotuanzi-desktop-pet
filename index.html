<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="小团子养成屋：从一个角色开始，慢慢把她养成真正的桌面宠物。">
  <title>小团子养成屋</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">XIAOTUANZI PROJECT</p>
        <h1>小团子养成屋</h1>
      </div>
      <div class="status-pill" aria-label="当前状态">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="status-text">正在待机</span>
      </div>
    </header>

    <section class="room" aria-label="小团子房间">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <div class="pet-wrap">
        <div id="pet" class="pet" role="button" tabindex="0" aria-label="小团子，点击与她互动">
          <div class="shadow" aria-hidden="true"></div>

          <svg class="tuanzi-svg" viewBox="0 0 420 420" role="img" aria-labelledby="pet-title pet-desc">
            <title id="pet-title">小团子</title>
            <desc id="pet-desc">小团子的第一阶段原型形象，保留指定标准脸型。</desc>

            <defs>
              <linearGradient id="bodyGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#e9edf4"/>
              </linearGradient>
              <linearGradient id="earGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f8fafc"/>
                <stop offset="100%" stop-color="#dfe5ee"/>
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".22"/>
              </filter>
            </defs>

            <g class="pet-art" filter="url(#softShadow)">
              <ellipse class="ear ear-left" cx="112" cy="127" rx="62" ry="82" fill="url(#earGradient)"/>
              <ellipse class="ear ear-right" cx="308" cy="127" rx="62" ry="82" fill="url(#earGradient)"/>

              <ellipse class="body" cx="210" cy="224" rx="138" ry="144" fill="url(#bodyGradient)"/>
              <path class="belly" d="M130 274 C152 334 268 352 294 274 C279 324 142 324 130 274Z" fill="#f5f7fa"/>

              <circle class="cheek cheek-left" cx="125" cy="238" r="16" fill="#ffd9e5"/>
              <circle class="cheek cheek-right" cx="295" cy="238" r="16" fill="#ffd9e5"/>

              <circle class="paw paw-left" cx="105" cy="305" r="35" fill="#eef2f7"/>
              <circle class="paw paw-right" cx="315" cy="305" r="35" fill="#eef2f7"/>

              <path class="flower-stem" d="M315 82 C330 61 333 48 325 32" fill="none" stroke="#83b68a" stroke-width="7" stroke-linecap="round"/>
              <g class="flower" transform="translate(326 30)">
                <circle cx="0" cy="0" r="9" fill="#f5c96b"/>
                <circle cx="0" cy="-18" r="11" fill="#ffdbe7"/>
                <circle cx="17" cy="-5" r="11" fill="#ffdbe7"/>
                <circle cx="11" cy="13" r="11" fill="#ffdbe7"/>
                <circle cx="-12" cy="13" r="11" fill="#ffdbe7"/>
                <circle cx="-17" cy="-5" r="11" fill="#ffdbe7"/>
              </g>

              <g class="face-plate">
                <rect x="92" y="184" width="236" height="86" rx="43" fill="#ffffff" fill-opacity=".94"/>
                <text x="210" y="242" text-anchor="middle"
                      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                      font-size="38"
                      fill="#2a2f3a">૮₍ ˃ ⤙ ˂ ₎ა</text>
              </g>
            </g>
          </svg>
        </div>

        <div class="nameplate" aria-label="角色信息">
          <strong>小团子</strong>
          <span>第一阶段 · 本人原型</span>
        </div>
      </div>

      <div class="interaction-card">
        <div>
          <span class="card-kicker">现在可以做什么</span>
          <p id="hint" class="hint">点一下小团子，看看她会不会理你。</p>
        </div>
        <div class="quick-actions" aria-label="互动操作">
          <button class="action-button" data-action="pat" type="button">摸摸</button>
          <button class="action-button" data-action="snack" type="button">小零食</button>
          <button class="action-button" data-action="play" type="button">陪玩</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>原生 HTML · CSS · JavaScript · SVG</span>
      <span>离线可运行 · 无第三方依赖</span>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
